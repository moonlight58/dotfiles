# =============================================================
#  Kitty — Nothing OS theme (flat, black/white/red)
#  Tokens: bg #1b1c1d | base #fdfdfd | accent #e2201f | muted #f5f0f08c
# =============================================================

include colors.conf

font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF
italic_font      JetBrainsMono NF
bold_italic_font JetBrainsMono NF
font_size        11.0

cursor_shape      block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# -------------------------------------------------------------
#  Window
# -------------------------------------------------------------
window_padding_width  5
window_margin_width   0
hide_window_decorations no
remember_window_size  yes
initial_window_width  120c
initial_window_height 30c
background_opacity 0.8

# -------------------------------------------------------------
#  Scrollback
# -------------------------------------------------------------
scrollback_lines 10000

# -------------------------------------------------------------
#  Performance
# -------------------------------------------------------------
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# -------------------------------------------------------------
#  Tabs — flat, no powerline chevrons (doesn't fit Nothing's minimalism)
# -------------------------------------------------------------
tab_bar_edge             bottom
tab_bar_style            fade
tab_fade                 1
tab_bar_min_tabs         1
tab_title_template       "{index}: {title}"
active_tab_font_style    bold

# -------------------------------------------------------------
#  Misc
# -------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0
term xterm-256color
