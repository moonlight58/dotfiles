font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF
italic_font      JetBrainsMono NF
bold_italic_font JetBrainsMono NF
font_size        11.0

foreground #fdfdfd
background #1b1c1d

selection_foreground #1b1c1d
selection_background #fdfdfd

cursor            #e2201f
cursor_text_color #1b1c1d
cursor_shape      block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# ANSI normal (0-7) — muted, desaturated, base/accent-driven
color0  #1b1c1d
color1  #e2201f
color2  #f5f0f0
color3  #f5f0f0
color4  #f5f0f0
color5  #e2201f
color6  #f5f0f0
color7  #fdfdfd

# ANSI bright (8-15)
color8  #4d4d4d
color9  #ff3b3a
color10 #fdfdfd
color11 #fdfdfd
color12 #fdfdfd
color13 #ff3b3a
color14 #fdfdfd
color15 #ffffff

# -------------------------------------------------------------
#  Window
# -------------------------------------------------------------
window_padding_width  10
window_margin_width   0
hide_window_decorations no
remember_window_size  yes
initial_window_width  120c
initial_window_height 30c
background_opacity 0.8

# -------------------------------------------------------------
#  Scrollback
# -------------------------------------------------------------
scrollback_lines 10000

# -------------------------------------------------------------
#  Performance
# -------------------------------------------------------------
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# -------------------------------------------------------------
#  Tabs 
# -------------------------------------------------------------
tab_bar_edge             bottom
tab_bar_style            fade
tab_fade                 1
tab_bar_min_tabs         1
tab_title_template       "{index}: {title}"
active_tab_foreground    #1b1c1d
active_tab_background    #e2201f
active_tab_font_style    bold
inactive_tab_foreground  #f5f0f0
inactive_tab_background  #1b1c1d
tab_bar_background       #1b1c1d

# -------------------------------------------------------------
#  Misc
# -------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0
term xterm-256color
