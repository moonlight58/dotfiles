# =============================================================
#  Kitty — Nothing OS theme (flat, black/white/red)
#  Tokens: bg #1b1c1d | base #fdfdfd | accent #e2201f | muted #f5f0f08c
# =============================================================

font_family      JetBrainsMono NF
bold_font        JetBrainsMono NF
italic_font      JetBrainsMono NF
bold_italic_font JetBrainsMono NF
font_size        11.0

foreground #fdfdfd
background #1b1c1d

selection_foreground #1b1c1d
selection_background #fdfdfd

cursor            #e2201f
cursor_text_color #1b1c1d
cursor_shape      block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #fdfdfd
color15 #ffffff

# -------------------------------------------------------------
#  Window
# -------------------------------------------------------------
window_padding_width  5
window_margin_width   0
hide_window_decorations no
remember_window_size  yes
initial_window_width  120c
initial_window_height 30c
background_opacity 0.8

# -------------------------------------------------------------
#  Scrollback
# -------------------------------------------------------------
scrollback_lines 10000

# -------------------------------------------------------------
#  Performance
# -------------------------------------------------------------
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# -------------------------------------------------------------
#  Tabs — flat, no powerline chevrons (doesn't fit Nothing's minimalism)
# -------------------------------------------------------------
tab_bar_edge             bottom
tab_bar_style            fade
tab_fade                 1
tab_bar_min_tabs         1
tab_title_template       "{index}: {title}"
active_tab_foreground    #1b1c1d
active_tab_background    #e2201f
active_tab_font_style    bold
inactive_tab_foreground  #f5f0f0
inactive_tab_background  #1b1c1d
tab_bar_background       #1b1c1d

# -------------------------------------------------------------
#  Misc
# -------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.0
term xterm-256color
