# --- "Nothing"-inspired theme (bg #1B1C1D / base #FDFDFD / accent #E2201F) ---
# n
#
# ANSI order: black;red;green;brown;blue;magenta;cyan;gray
# Each hue is desaturated toward gray (not pure gray) so it still reads as
# "that" color at a glance, while the accent red stays fully saturated.
term_palette: 1B1C1D;E2201F;7A8A78;8C8570;727C8C;8C7A86;748C88;FDFDFD
term_palette_bright: 3A3B3C;E2201F;9AAC96;B0A88C;96A0B0;A692A0;9CB0AC;FDFDFD

term_background: FF1B1C1D
term_foreground: FDFDFD
term_background_bright: FF3A3B3C
term_foreground_bright: FDFDFD

# Accent red for menu chrome/branding
interface_branding_color: E2201F
interface_help_color: E2201F
interface_help_color_bright: E2201F

# --- Fonts ---
# NOTE: Limine's term_font only accepts a raw bitmap .F16 (CP437, 256 glyphs)
# font file, it CANNOT load TTF/OTF fonts like "JetBrainsMono Nerd Font" or
# the "Nothing font (5x7)" directly - those only work in userspace apps (Waybar, etc).
# Browse/pick one at https://github.com/viler-int10h/vga-text-mode-fonts
# (see the PREVIEWS/ folder for a .png render of every font), then:
term_font: boot():/limine_font.F09
term_font_scale: 1x1

# --- Optional wallpaper (uncomment and provide a file to fully match the theme) ---
wallpaper: boot():/wallpaper.png
wallpaper_style: centered

timeout: 5

/Arch Linux (linux)
    protocol: efi
    path: boot():/EFI/Linux/arch-linux.efi
    cmdline: root=PARTUUID=d8553482-c5f8-4805-9ca6-3e270782e333 zswap.enabled=0 rw rootfstype=ext4
