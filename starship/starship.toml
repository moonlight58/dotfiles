# AUTO-GENERATED by apply_theme.py — edit palette.json, not this file.
# Starship has no "include another file" directive, so unlike the others
# this template IS your whole starship.toml. Move your real config's
# content here and drop placeholder tokens (double-curly-brace syntax,
# same as the other templates) into the style strings where you want a
# themed color. Starship re-reads this file on every new prompt, so no
# reload step is needed at all.

add_newline = true

format = """
[$directory]($style)[$git_branch]($style)[$git_status](bold red)\
$line_break\
$username\
$hostname\
[$character]($style)"""

continuation_prompt = "[>](bold #4166f5) "

[username]
style_user = "#fdfdfd"
style_root = "dimmed #4166f5"
format = '''[$user]($style)'''
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '[@](#979898)[$hostname](bold #fdfdfd) '
disabled = false

[character]
success_symbol = "[>](bold #4166f5)"
error_symbol   = "[>](bold #4166f5)"
vimcmd_symbol  = "[<](bold #4166f5)"

[directory]
style             = "bold #fdfdfd"
format            = "[$path]($style)[$read_only]($read_only_style)"
read_only         = " ×"
read_only_style   = "#4166f5"
truncation_length = 4
truncate_to_repo  = false
home_symbol       = "~"

[git_branch]
format = " [\\(](#979898)[$branch](#4166f5)[\\)](#979898)"
style  = "#4166f5"

[git_status]
format     = "[$all_status$ahead_behind]($style)"
style      = "bold #4166f5"
conflicted = "!"
ahead      = "^${count}"
behind     = "v${count}"
diverged   = "<>"
modified   = "~"
untracked  = "?"
staged     = "+"
deleted    = "-"

[nodejs]
disabled = false
format   = " [node $version](#979898)"

[python]
disabled = false
format   = " [py $version](#979898)"

[rust]
disabled = false
format   = " [rs $version](#979898)"

[cmd_duration]
min_time = 2000
format   = " [${duration}](#979898)"

[status]
disabled = false
format   = " [x $status](bold #4166f5)"

[jobs]
disabled = false
format   = " [job:$number](#979898)"

[time]
disabled    = true
format      = " [$time](#979898)"
time_format = "%H:%M"

[package]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[terraform]
disabled = true
[kubernetes]
disabled = true

