## Nothing OS-themed hyprlock config
## Tokens:
##   bg-color:      #1b1c1d
##   base:          #fdfdfd
##   accent:        #e2201f
##   muted:         #f5f0f08c
##   fonts:         "Nothing Font (5x7)" (display), "JetBrainsMono Nerd Font" (mono/fallback)

$bgColor    = rgb(1b1c1d)
$baseColor  = rgb(fdfdfd)
$accentColor = rgb(e2201f)
$mutedColor = rgba(f5f0f08c)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = $bgColor
    # swap to a screenshot blur if you'd rather not use flat bg:
    # path = screenshot
    # blur_passes = 2
    # blur_size = 7
}

# Time — big display font, Nothing dot-matrix style
# Hour in accent (red), ":MM" in base (white) — split via pango spans in the cmd output
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##e2201f'>$(date +"%H")</span><span foreground='##fdfdfd'>:$(date +"%M")</span>"
    font_size = 90
    font_family = Nothing Font (5x7)
    position = 0, 140
    halign = center
    valign = center
}

# Date — muted, mono fallback for readability at small size
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = $mutedColor
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Password input field — flat black pill, red accent on interaction
input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accentColor
    inner_color = $bgColor
    font_color = $baseColor
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##f5f0f08c">Enter Password</span>
    hide_input = false

    check_color = $accentColor
    fail_color = $accentColor
    fail_text = <span foreground="##e2201f">Wrong password</span>

    position = 0, -60
    halign = center
    valign = center
}

# User label above input
label {
    monitor =
    text = $USER
    color = $mutedColor
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}
