source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $background
}

# Hour in accent, ":MM" in foreground
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##$hex_accent'>$(date +"%H")</span><span foreground='##$hex_foreground'>:$(date +"%M")</span>"
    font_size = 90
    font_family = Nothing Font (5x7)
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = $muted
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent
    inner_color = $background
    font_color = $foreground
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = true
    fade_timeout = 500
    placeholder_text = <span foreground="##$hex_muted">Enter Password</span>
    hide_input = false

    check_color = $accent
    fail_color = $accent
    fail_text = <span foreground="##$hex_accent">Wrong password</span>

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $muted
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}
